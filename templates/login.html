<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Painel Administrativo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans flex items-center justify-center h-screen">

    <div class="bg-white p-8 rounded-2xl shadow-md w-full max-w-md border border-slate-200">
        <div class="text-center mb-6">
            <div class="inline-flex bg-indigo-50 text-indigo-600 p-3 rounded-full mb-2">
                <i class="fa-solid fa-lock text-xl"></i>
            </div>
            <h1 class="text-xl font-bold text-slate-900">Acesso Restrito</h1>
            <p class="text-slate-500 text-xs mt-1">Digite a senha para acessar o painel administrativo.</p>
        </div>

        {% if erro %}
        <div class="bg-red-50 border border-red-200 text-red-600 text-xs p-3 rounded-xl mb-4 text-center font-medium">
            {{ erro }}
        </div>
        {% endif %}

        <form action="/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Senha de Acesso</label>
                <input type="password" name="senha" required placeholder="Digite a senha..." class="w-full border rounded-xl p-3 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition shadow">Entrar no Painel</button>
        </form>

        <div class="text-center mt-6">
            <a href="/" class="text-xs text-slate-500 hover:text-indigo-600 transition"><i class="fa-solid fa-arrow-left mr-1"></i> Voltar para o Cardápio (Cliente)</a>
        </div>
    </div>

</body>
</html>
